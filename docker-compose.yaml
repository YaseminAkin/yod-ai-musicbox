version: '3.8'

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - oemer-models:/root/.oemer
    restart: always
    networks:
      - app
    container_name: musicbox-server

  front:
    build:
      context: ./Front/vite-project
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - server
    restart: always
    networks:
      - app
    container_name: musicbox

volumes:
  oemer-models:

networks:
  app:
    driver: bridge
